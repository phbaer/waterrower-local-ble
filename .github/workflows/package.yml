name: Build HACS package

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Sync locked project environment
        run: uv sync --locked
      - name: Validate integration source
        run: uv run python -m py_compile custom_components/waterrower_ble/*.py
      - name: Run unit tests
        run: uv run python -m unittest discover -s tests -v
      - name: Build HACS package
        run: uv run python scripts/package.py --output dist
      - name: Upload HACS package
        uses: actions/upload-artifact@v7
        with:
          name: waterrower-local-ble-hacs
          path: dist/*.zip
          if-no-files-found: error
